<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dispatch Today</title>
<style>
:root {
  --bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;
  --text:#e2e8f0;--muted:#64748b;
  --blue:#3b82f6;--green:#22c55e;--yellow:#f59e0b;
  --red:#ef4444;--purple:#a855f7;--cyan:#06b6d4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;overflow-x:hidden;}

.header{background:var(--card);border-bottom:1px solid var(--border);padding:0.8rem 1rem;position:sticky;top:0;z-index:100;}
.htop{display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:1rem;font-weight:700;color:#fff;}
.header p{font-size:10px;color:var(--muted);margin-top:2px;}
.hright{display:flex;align-items:center;gap:8px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.rtime{font-size:10px;color:var(--muted);}
.btnr{background:var(--border);border:1px solid #3a3d4a;color:var(--text);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;}

/* SUMMARY - 1 row 6 col compact */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:5px;padding:0.6rem 1rem;}
.sc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 3px;text-align:center;}
.sc-l{font-size:7px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sc-v{font-size:1.1rem;font-weight:700;line-height:1;}

/* FILTERS */
.filters{padding:0 1rem 0.8rem;display:flex;flex-direction:column;gap:7px;}
.sw{position:relative;}
.fi{background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 12px 9px 32px;border-radius:8px;font-size:13px;outline:none;width:100%;}
.fi:focus{border-color:var(--blue);}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.fs{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 8px;border-radius:8px;font-size:11px;outline:none;cursor:pointer;width:100%;}
.cnt-row{display:flex;justify-content:space-between;}
.cnt{background:var(--border);color:var(--muted);font-size:10px;padding:3px 8px;border-radius:20px;}

/* TABLE */
.tw{padding:0 1rem;}
.twrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.tscr{overflow-x:hidden;max-height:55vh;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;}
thead{position:sticky;top:0;z-index:10;background:#12151f;}
th{padding:8px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border);}
th:nth-child(1){width:30%;}
th:nth-child(2){width:30%;}
th:nth-child(3){width:20%;}
th:nth-child(4){width:20%;}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;}
tbody tr:hover{background:rgba(255,255,255,0.03);}
tbody tr:last-child{border-bottom:none;}
tbody tr.arow{background:rgba(59,130,246,0.07);}
td{padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;}
td.nc{white-space:normal;line-height:1.3;}
.nc-id{font-size:9px;color:var(--muted);}

/* DETAIL ROW */
.drow td{padding:0;background:rgba(59,130,246,0.04);}
.dbox{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.di{background:rgba(255,255,255,0.03);border-radius:6px;padding:6px 8px;}
.dl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;}
.dv{font-size:11px;color:var(--text);font-weight:500;}
.dbtns{display:flex;gap:7px;}
.dbtn{flex:1;padding:7px;border-radius:8px;font-size:11px;font-weight:600;text-decoration:none;text-align:center;border:none;cursor:pointer;}
.dbtn-map{background:rgba(168,85,247,0.15);color:var(--purple);border:1px solid rgba(168,85,247,0.2);}
.dbtn-form{background:rgba(59,130,246,0.12);color:var(--blue);border:1px solid rgba(59,130,246,0.2);}
.dbtn-ops{background:rgba(34,197,94,0.12);color:var(--green);border:1px solid rgba(34,197,94,0.2);}

/* BADGES */
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;}
.b-open{background:rgba(239,68,68,0.15);color:var(--red);}
.b-done{background:rgba(34,197,94,0.15);color:var(--green);}
.b-prog{background:rgba(245,158,11,0.15);color:var(--yellow);}
.b-rep{background:rgba(59,130,246,0.15);color:var(--blue);}
.b-pick{background:rgba(168,85,247,0.15);color:var(--purple);}
.b-offl{background:rgba(239,68,68,0.15);color:var(--red);}
.b-cat{background:rgba(6,182,212,0.12);color:var(--cyan);}
.b-t1{background:rgba(245,158,11,0.2);color:var(--yellow);}
.b-t2{background:rgba(100,116,139,0.12);color:var(--muted);}
.b-on{background:rgba(34,197,94,0.15);color:var(--green);}
.b-off{background:rgba(239,68,68,0.15);color:var(--red);}

/* MAP */
.mapsec{padding:0.8rem 1rem 1rem;}
.maptitle{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;}
#map{height:300px;border-radius:12px;border:1px solid var(--border);overflow:hidden;background:#12151f;display:flex;align-items:center;justify-content:center;}
.map-placeholder{color:var(--muted);font-size:12px;text-align:center;}
.mlegend{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;}
.mli{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);}
.mld{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

.loading{display:flex;align-items:center;justify-content:center;padding:3rem;gap:1rem;flex-direction:column;}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:12px;}
.footer{font-size:10px;color:var(--muted);text-align:center;padding:0.5rem 1rem 1.5rem;}

.leaflet-popup-content-wrapper{background:#1a1d27;border:1px solid #2a2d3a;border-radius:10px;color:#e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
.leaflet-popup-tip{background:#1a1d27;}
.pu-id{font-size:10px;color:#06b6d4;font-weight:600;margin-bottom:4px;}
.pu-name{font-weight:700;font-size:12px;margin-bottom:6px;}
.pu-row{font-size:11px;color:#94a3b8;margin-bottom:3px;}
.pu-row span{color:#e2e8f0;}
.pu-btns{display:flex;gap:6px;margin-top:8px;}
.pu-btn{flex:1;padding:5px;border-radius:6px;font-size:10px;font-weight:600;text-decoration:none;text-align:center;}
</style>
</head>
<body>

<div class="header">
  <div class="htop">
    <div><h1>📍 Dispatch Today</h1><p>Auto refresh 5 menit</p></div>
    <div class="hright">
      <span class="dot"></span>
      <span class="rtime" id="rtime">Memuat...</span>
      <button class="btnr" onclick="loadData()">⟳</button>
    </div>
  </div>
</div>

<div class="sum-grid" id="summary"></div>

<div class="filters">
  <div class="sw"><span class="si">🔍</span><input class="fi" id="srch" placeholder="Cari terminal / tiket / teknisi..." oninput="applyFilter()"></div>
  <div class="fr">
    <select class="fs" id="fStatus" onchange="applyFilter()"><option value="">Semua Status</option></select>
    <select class="fs" id="fCat"    onchange="applyFilter()"><option value="">Semua Kategori</option></select>
  </div>
  <div class="fr">
    <select class="fs" id="fTech" onchange="applyFilter()"><option value="">Semua Teknisi</option></select>
    <select class="fs" id="fLoc"  onchange="applyFilter()"><option value="">Semua Lokasi</option></select>
  </div>
  <div class="cnt-row"><span class="cnt" id="cnt">0 tiket</span></div>
</div>

<div class="tw">
  <div class="loading" id="loading"><div class="spinner"></div><span style="color:var(--muted);font-size:12px">Memuat data...</span></div>
  <div class="twrap" id="twrap" style="display:none">
    <div class="tscr">
      <table>
        <thead><tr>
          <th>Tiket</th><th>Terminal</th><th>Status</th><th>Kategori</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <div class="empty" id="empty" style="display:none">Tidak ada tiket</div>
</div>

<div class="mapsec">
  <div class="maptitle">🗺 PETA LOKASI</div>
  <div id="map"><div class="map-placeholder">⏳ Scroll ke sini untuk memuat peta</div></div>
  <div class="mlegend">
    <div class="mli"><div class="mld" style="background:#ef4444"></div>Open</div>
    <div class="mli"><div class="mld" style="background:#22c55e"></div>Done</div>
    <div class="mli"><div class="mld" style="background:#f59e0b"></div>Progress</div>
    <div class="mli"><div class="mld" style="background:#64748b"></div>Lainnya</div>
  </div>
</div>

<p class="footer" id="footer"></p>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7w8YOcnZ7r9jBhqaFebXh0fIVg1P_v-vC7Bq9gcSW_dQcGVth68VDM7u8xzq_NwIHwPiv8Nsa36Fk/pub?gid=1981614453&single=true&output=csv';

let DATA=[], FILTERED=[], map=null, markerLayer=null, mapReady=false, openDetail=null;

// ── Parse CSV ──
function parseCSV(t){
  return t.trim().split('\n').map(line=>{
    const c=[];let cur='',q=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){q=!q;}
      else if(line[i]===','&&!q){c.push(cur.trim());cur='';}
      else{cur+=line[i];}
    }
    c.push(cur.trim());return c;
  });
}

// ── Load data ──
async function loadData(){
  document.getElementById('rtime').textContent='Memuat...';
  try{
    const t=await fetch(CSV_URL+'&t='+Date.now()).then(r=>r.text());
    DATA=parseCSV(t).slice(1)
      .filter(r=>r[0]&&(r[0].trim().startsWith('TS')||r[0].trim().startsWith('PMT')))
      .map(r=>{
        const g=i=>(r[i]!=null&&r[i]!==undefined)?String(r[i]).trim():'';
        const ll=g(13)?g(13).split(','):[];
        return{
          id:g(0),ts:g(1),termId:g(2),termName:g(3),
          type:g(4),tier:g(5),loc:g(6),ovo:g(7),
          pb:g(8),pbN:parseFloat(g(8))||0,cat:g(9),issue:g(10),
          tech:g(11),link:g(12),
          lat:ll[0]?parseFloat(ll[0]):null,lng:ll[1]?parseFloat(ll[1]):null,
          status:g(14),assign:g(15),
          repCat:g(16),repIssue:g(17),
          solution:g(18),ops:g(19)
        };
      });
    fillFilters();
    applyFilter();
    document.getElementById('rtime').textContent=new Date().toLocaleTimeString('id-ID');
  }catch(e){
    document.getElementById('rtime').textContent='⚠ Error';
  }
}

// ── Fill filters ──
function fillFilters(){
  fillSel('fStatus',[...new Set(DATA.map(r=>r.status).filter(Boolean))].sort());
  fillSel('fCat',   [...new Set(DATA.map(r=>r.cat).filter(Boolean))].sort());
  fillSel('fTech',  [...new Set(DATA.map(r=>r.tech).filter(Boolean))].sort());
  fillSel('fLoc',   [...new Set(DATA.map(r=>r.loc).filter(Boolean))].sort());
}
function fillSel(id,vals){
  const s=document.getElementById(id),cur=s.value,f=s.options[0].outerHTML;
  s.innerHTML=f;
  vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(v===cur)o.selected=true;s.appendChild(o);});
}

// ── Apply filter ──
function applyFilter(){
  const s=document.getElementById('srch').value.toLowerCase();
  const st=document.getElementById('fStatus').value;
  const cat=document.getElementById('fCat').value;
  const tech=document.getElementById('fTech').value;
  const loc=document.getElementById('fLoc').value;

  FILTERED=DATA.filter(r=>{
    const ms=!s||r.termName.toLowerCase().includes(s)||r.id.toLowerCase().includes(s)||r.tech.toLowerCase().includes(s)||r.termId.toLowerCase().includes(s);
    return ms&&(!st||r.status===st)&&(!cat||r.cat===cat)&&(!tech||r.tech===tech)&&(!loc||r.loc===loc);
  });

  // Summary
  const op=FILTERED.filter(r=>r.status.toLowerCase()==='open').length;
  const dn=FILTERED.filter(r=>r.status.toLowerCase()==='done'||r.status.toLowerCase()==='closed').length;
  // Dynamic category counts from FILTERED data
  const catCounts={};
  FILTERED.forEach(r=>{if(r.cat)catCounts[r.cat]=(catCounts[r.cat]||0)+1;});
  const catColors={'Replenish PB':'var(--blue)','Pickup':'var(--purple)','Offline >1day':'var(--yellow)','Preventive':'var(--cyan)'};
  const catCards=Object.keys(catCounts).sort().map(cat=>{
    const cnt=catCounts[cat];
    const shortLabel=cat==='Replenish PB'?'Rplsh':cat==='Offline >1day'?'Offline':cat==='Preventive'?'Prev':cat;
    const color=catColors[cat]||'var(--muted)';
    return{l:shortLabel,v:cnt,c:color};
  });
  document.getElementById('summary').innerHTML=[
    {l:'Total', v:FILTERED.length,c:'var(--blue)'},
    {l:'Open',  v:op,  c:'var(--red)'},
    {l:'Done',  v:dn,  c:'var(--green)'},
    ...catCards,
  ].map(x=>`<div class="sc"><div class="sc-l">${x.l}</div><div class="sc-v" style="color:${x.c}">${x.v}</div></div>`).join('');

  document.getElementById('cnt').textContent=FILTERED.length+' tiket';
  renderTable();
  if(mapReady) renderMap();
  document.getElementById('footer').textContent='Update: '+new Date().toLocaleString('id-ID');
}

// ── Badges ──
function sBadge(s){
  if(!s)return'-';const sl=s.toLowerCase();
  if(sl==='open')return`<span class="badge b-open">🔴 Open</span>`;
  if(sl==='done'||sl==='closed')return`<span class="badge b-done">✅ Done</span>`;
  if(sl.includes('progress'))return`<span class="badge b-prog">🟡 Prog</span>`;
  return`<span class="badge b-cat">${s}</span>`;
}
function cBadge(c){
  if(!c)return'-';const cl=c.toLowerCase();
  if(cl.includes('replenish'))return`<span class="badge b-rep">Replenish PB</span>`;
  if(cl.includes('pickup'))return`<span class="badge b-pick">Pickup</span>`;
  if(cl.includes('offline'))return`<span class="badge b-offl">Offline &gt;1day</span>`;
  if(cl.includes('preventive'))return`<span class="badge" style="background:rgba(6,182,212,0.15);color:var(--cyan)">Preventive</span>`;
  return`<span class="badge b-cat">${c}</span>`;
}
function pbCol(n){return n>=50?'var(--green)':n>=25?'var(--yellow)':'var(--red)';}

// ── Render table ──
function renderTable(){
  document.getElementById('loading').style.display='none';
  if(!FILTERED.length){
    document.getElementById('twrap').style.display='none';
    document.getElementById('empty').style.display='block';
    return;
  }
  document.getElementById('twrap').style.display='block';
  document.getElementById('empty').style.display='none';
  openDetail=null;

  document.getElementById('tbody').innerHTML=FILTERED.map((r,i)=>`
    <tr id="row-${i}" onclick="toggle(${i})">
      <td style="color:var(--cyan);font-size:10px;font-weight:600">${r.id}<br><span style="color:var(--muted);font-size:9px">${r.ts}</span></td>
      <td class="nc"><div style="font-weight:500;font-size:11px;line-height:1.3">${r.termName||'-'}</div><div class="nc-id">${r.termId}</div></td>
      <td>${sBadge(r.status)}</td>
      <td>${cBadge(r.cat)}</td>
    </tr>
    <tr class="drow" id="det-${i}" style="display:none">
      <td colspan="4">
        <div class="dbox">
          <div class="dgrid">
            <div class="di"><div class="dl">Koneksi</div><div class="dv"><span class="badge ${r.ovo.toLowerCase()==='online'?'b-on':'b-off'}">${r.ovo||'-'}</span></div></div>
            <div class="di"><div class="dl">PB%</div><div class="dv" style="color:${pbCol(r.pbN)}">${r.pb||'-'}</div></div>
            <div class="di"><div class="dl">Teknisi</div><div class="dv">${r.tech||'-'}</div></div>
            <div class="di"><div class="dl">Tier</div><div class="dv"><span class="badge ${r.tier==='1'?'b-t1':'b-t2'}">Tier ${r.tier}</span></div></div>
            <div class="di"><div class="dl">Lokasi</div><div class="dv">${r.loc||'-'}</div></div>
            <div class="di"><div class="dl">Assign</div><div class="dv">${r.assign||'-'}</div></div>
          </div>
          ${r.issue?`<div class="di"><div class="dl">Issue</div><div class="dv" style="white-space:normal">${r.issue}</div></div>`:''}
          ${r.solution?`<div class="di"><div class="dl">Solution</div><div class="dv" style="white-space:normal">${r.solution}</div></div>`:''}
          <div class="dbtns">
            ${r.lat&&r.lng?`<button onclick="goMap(${r.lat},${r.lng},event)" class="dbtn dbtn-map">🗺 Peta</button>`:''}
            ${r.link?`<a href="${r.link}" target="_blank" class="dbtn dbtn-form">📋 Form</a>`:''}
            ${r.ops?`<a href="${r.ops}" target="_blank" class="dbtn dbtn-ops">⚡ Ops</a>`:''}
          </div>
        </div>
      </td>
    </tr>
  `).join('');
}

function toggle(i){
  const det=document.getElementById('det-'+i);
  const row=document.getElementById('row-'+i);
  if(openDetail!==null&&openDetail!==i){
    document.getElementById('det-'+openDetail).style.display='none';
    document.getElementById('row-'+openDetail).classList.remove('arow');
  }
  if(det.style.display==='none'){det.style.display='table-row';row.classList.add('arow');openDetail=i;}
  else{det.style.display='none';row.classList.remove('arow');openDetail=null;}
}

// ── Map (lazy load) ──
function loadLeaflet(cb){
  if(window.L){cb();return;}
  const css=document.createElement('link');css.rel='stylesheet';
  css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  const js=document.createElement('script');
  js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  js.onload=cb;document.head.appendChild(js);
}

function initMap(){
  if(map)return;
  document.getElementById('map').innerHTML='';
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([-6.2,106.8],9);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
  markerLayer=L.layerGroup().addTo(map);
  mapReady=true;
  renderMap();
}

function renderMap(){
  if(!map||!markerLayer)return;
  markerLayer.clearLayers();
  const pts=FILTERED.filter(r=>r.lat&&r.lng);
  pts.forEach(r=>{
    const col=r.status.toLowerCase()==='open'?'#ef4444':r.status.toLowerCase()==='done'||r.status.toLowerCase()==='closed'?'#22c55e':r.status.toLowerCase().includes('progress')?'#f59e0b':'#64748b';
    const ic=L.divIcon({className:'',html:`<div style="width:12px;height:12px;border-radius:50%;background:${col};border:2px solid #fff;box-shadow:0 0 5px ${col}88"></div>`,iconSize:[12,12],iconAnchor:[6,6]});
    L.marker([r.lat,r.lng],{icon:ic}).bindPopup(`
      <div class="pu-id">${r.id}</div>
      <div class="pu-name">${r.termName}</div>
      <div class="pu-row">Status: <span>${r.status}</span></div>
      <div class="pu-row">Kategori: <span>${r.cat}</span></div>
      <div class="pu-row">Teknisi: <span>${r.tech||'-'}</span></div>
      <div class="pu-row">PB%: <span style="color:${pbCol(r.pbN)}">${r.pb||'-'}</span></div>
      <div class="pu-btns">
        ${r.link?`<a href="${r.link}" target="_blank" class="pu-btn" style="background:rgba(59,130,246,0.2);color:#3b82f6">📋 Form</a>`:''}
        ${r.ops?`<a href="${r.ops}" target="_blank" class="pu-btn" style="background:rgba(34,197,94,0.2);color:#22c55e">⚡ Ops</a>`:''}
      </div>`,{maxWidth:240}).addTo(markerLayer);
  });
  if(pts.length){
    const b=L.latLngBounds(pts.map(r=>[r.lat,r.lng]));
    map.fitBounds(b,{padding:[20,20]});
  }
}

function goMap(lat,lng,e){
  e.stopPropagation();
  document.getElementById('mapsec'||'map').scrollIntoView({behavior:'smooth'});
  loadLeaflet(()=>{
    if(!map)initMap();
    setTimeout(()=>{map.setView([lat,lng],16);map.invalidateSize();},400);
  });
}

// Lazy load map on scroll
const obs=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting&&!mapReady){
    loadLeaflet(()=>initMap());
  }
},{threshold:0.1});
obs.observe(document.getElementById('map'));

// Start
loadData();
setInterval(loadData,5*60*1000);
</script>
